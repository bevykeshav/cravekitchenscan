<style>
:root{--bg:#6cd400;--ink:#14290a;--mut:#4a5e3f;--red:#1d5a0b;--gold:#ffd23f;--line:#cfe8b5;--card:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:16px 18px 40px}
.logo{display:block;width:min(52vw,210px);height:auto;margin:6px auto 4px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 14px rgba(20,41,10,.25)}
h1{font:700 26px/1.25 Georgia,serif;text-align:center;margin:10px 0 6px}
.sub{color:var(--ink);text-align:center;margin:0 0 18px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 18px rgba(20,41,10,.18)}
label{display:block;font-weight:600;margin:14px 0 6px}
label:first-child{margin-top:0}
input,textarea{width:100%;min-height:52px;padding:12px 14px;font:inherit;font-size:17px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--red)}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-weight:400;font-size:15px;color:var(--mut)}
.chk input{width:26px;min-height:26px;height:26px;flex:none;margin:0;accent-color:var(--red)}
button{width:100%;min-height:54px;margin-top:18px;padding:12px;font:700 18px inherit;background:var(--red);color:#fff;border:0;border-radius:14px;cursor:pointer}
button:active{transform:scale(.98)}
button:disabled{opacity:.6}
button.sec{background:#fff;color:var(--red);border:2px solid var(--red)}
.cust{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;min-height:58px;margin:8px 0 0;background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:600;font-size:17px}
.cust small{font-weight:400;color:var(--mut);font-size:15px}
.cust.on{border-color:var(--red);background:#e6f6d3}
.note{font-size:14px;color:var(--ink);text-align:center;margin:16px 4px 0}
.msg{margin-top:14px;font-weight:600;text-align:center;min-height:24px}
.ok{text-align:center;padding:24px 8px}
.hide{display:none}
</style>
</head>

<section id="cust">
  <h1>Join Us on Instagram</h1>
  <p class="sub">Please enter your details to continue to our Instagram page.</p>
  <div class="box">
    <label for="n">Name</label>
    <input id="n" autocomplete="name" placeholder="Enter your name">
    <label for="p">Mobile number</label>
    <input id="p" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10-digit mobile number">
    <button id="go">Continue to Instagram</button>
    <div class="msg" id="cm" role="status"></div>
  </div>
  <p class="note">By continuing, you agree that Crave Kitchen may use your name and number to share offers and updates.</p>
</section>
</main>
<script>
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwzHItkU6K1yQHCNPTQBEk2SanYJEkfykA51qFsqXlMP_RXEFoVmTSl6bWecF0iA0uc9A/exec',
  INSTAGRAM: 'https://www.instagram.com/cravekitchen1092026/'
};
const $ = id => document.getElementById(id);
$('go').onclick = async () => {
  const name = $('n').value.trim(), phone = $('p').value.replace(/\D/g, '');
  const m = $('cm');
  if (!name) { m.textContent = 'Please enter your name.'; return; }
  if (!/^[6-9]\d{9}$/.test(phone)) { m.textContent = 'Please enter a valid 10-digit mobile number.'; return; }
  $('go').disabled = true; m.textContent = 'Opening Instagram...';
  try {
    await Promise.race([
      fetch(CONFIG.SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'customer', name, phone, offers: true }) }),
      new Promise(r => setTimeout(r, 4000))
    ]);
  } catch (e) {}
  location.href = CONFIG.INSTAGRAM;
};
</script>
</body>
